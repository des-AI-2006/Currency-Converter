<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="CurrenCon.css?v=2.1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <!-- <h1>Currency Converter</h1> -->

    <div class="container">
        <h2>Currency Converter</h2>
        <form>
            <div class="amount">
                <p>Enter amount</p>
                <input value="1" type="number">
            </div>
            <div class="dropdown">
                <div class="from">
                    <p>From</p>
                    <div class="select-container" id="from-select-container">
                        <div class="select-trigger">
                            <img src="https://flagsapi.com/US/flat/64.png">
                            <span class="select-text">USD</span>
                            <i class="fa-solid fa-chevron-down select-chevron"></i>
                        </div>
                        <div class="options-dropdown">
                            <input type="text" placeholder="Search..." class="search-input">
                            <div class="options-list"></div>
                        </div>
                    </div>
                </div>
                <i class="fa-solid fa-arrow-right-arrow-left"></i>
                <div class="to">
                    <p>To</p>
                    <div class="select-container" id="to-select-container">
                        <div class="select-trigger">
                            <img src="https://flagsapi.com/IN/flat/64.png">
                            <span class="select-text">INR</span>
                            <i class="fa-solid fa-chevron-down select-chevron"></i>
                        </div>
                        <div class="options-dropdown">
                            <input type="text" placeholder="Search..." class="search-input">
                            <div class="options-list"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="msg">1 USD = -- INR</div>
            <button>Get Exchange Rate</button>
        </form>
        <div class="popular-conversions" id="popular-conversions">
            <h3>Popular Conversions</h3>
            <div class="conversions-grid"></div>
        </div>
    </div>

    <script src="codes.js?v=1.1"></script>
    <script src="CurrencyConverter.js?v=1.3"></script>
</body>
</html>
